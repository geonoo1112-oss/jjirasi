<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="25%" y1="5%" x2="75%" y2="95%">
      <stop offset="0%" stop-color="#263575"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>
  </defs>

  <!-- 배경 (iOS 스타일 둥근 모서리) -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- 번개 본체 (빨간색) - 원본 앱 아이콘 비율에 맞게 -->
  <polygon
    points="133,16 74,16 50,105 94,105 68,184 150,95 106,95 130,16"
    fill="#D42020"/>

  <!-- 흰색 하이라이트 — 상단 왼쪽 사선 -->
  <polygon
    points="74,16 97,16 73,105 50,105"
    fill="white"/>

  <!-- 흰색 하이라이트 — 하단 왼쪽 사선 -->
  <polygon
    points="94,105 116,105 90,184 68,184"
    fill="white"/>
</svg>
